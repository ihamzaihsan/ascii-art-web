<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Turn text into ASCII art with three classic banner styles.">
    <link rel="stylesheet" href="/assets/styles.css">
    <link rel="icon" href="/assets/favicon.png" type="image/png">
    <title>ASCII Art Generator</title>
</head>
<body>
<main>
    <header><p class="eyebrow">TEXT → ART</p><h1>ASCII Art Generator</h1>
    <p>Give your words a little character. Choose a style and make something worth copying.</p></header>
    <form action="/ascii-art" method="post" class="panel">
        <label for="input-text">Your text</label>
        <p id="input-help" class="hint">Up to 100 characters. Use English letters, numbers, spaces, punctuation, and line breaks.</p>
        <textarea id="input-text" name="input-text" rows="4" maxlength="100" required aria-describedby="input-help" placeholder="Hello, world!"></textarea>
        <fieldset>
            <legend>Banner style</legend>
            <div class="styles">
                <label><input type="radio" name="banner" value="standard" checked> Standard</label>
                <label><input type="radio" name="banner" value="shadow"> Shadow</label>
                <label><input type="radio" name="banner" value="thinkertoy"> Thinkertoy</label>
            </div>
        </fieldset>
        <button type="submit">Generate ASCII art</button>
    </form>
    <footer>Three classic styles. Plain text output. No account needed.</footer>
</main>
</body>
</html>
