<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/styles.css">
    <link rel="icon" href="/assets/favicon.png" type="image/png">
    <title>Your ASCII Art</title>
</head>
<body>
<main>
    <header><p class="eyebrow">TEXT → ART</p><h1>Your ASCII art</h1>
    <p>Rendered with the <strong>{{.Banner}}</strong> banner.</p></header>
    <section class="panel" aria-label="Generated result">
        <label for="ascii-result">Select and copy your artwork</label>
        <p id="result-help" class="hint">Keep a monospace font when pasting to preserve alignment. Scroll sideways for wider artwork.</p>
        <textarea id="ascii-result" class="output" rows="12" readonly wrap="off" spellcheck="false" aria-describedby="result-help">{{.Result}}</textarea>
        <details><summary>Original text</summary><pre>{{.Input}}</pre></details>
        <a class="button" href="/">Generate another</a>
    </section>
</main>
</body>
</html>
