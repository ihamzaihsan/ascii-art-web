name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l main.go src)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/image-preview.js
      - run: node --check assets/image-controls.js
      - run: go vet ./...
      - run: go build -o ascii-studio .
