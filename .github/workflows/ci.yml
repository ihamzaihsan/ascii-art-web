name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.x'
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l main.go src)"
      - run: go vet ./...
      - run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - run: go build -o ascii-art-web .
